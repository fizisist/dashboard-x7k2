<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dining Room Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dining Room Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: landscape tablet. Header strip on top, weather on the left, Ciara's train board on the right. Stacks to one column on narrow screens. */
:root {
  --bg: #eef1f3;
  --panel: #ffffff;
  --ink: #15232d;
  --muted: #5d6f7b;
  --line: #d5dde2;
  --accent: #0b6e8a;
  --rain: #2b6cb0;
  --warn: #b4531a;
  --good: #2f7d4f;
  --board: #0e1b22;
  --board-ink: #ffc857;
  --board-dim: #8fa3ad;
  --board-line: #25363f;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1419; --panel: #142129; --ink: #e8eff3; --muted: #93a6b2; --line: #263944;
    --accent: #4fb6d3; --rain: #7fb2ea; --warn: #f0a066; --good: #6cc48f;
    --board: #070e12; --board-line: #1d2c34;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1419; --panel: #142129; --ink: #e8eff3; --muted: #93a6b2; --line: #263944;
  --accent: #4fb6d3; --rain: #7fb2ea; --warn: #f0a066; --good: #6cc48f;
  --board: #070e12; --board-line: #1d2c34;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  padding-block: max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-bottom, 0px));
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.num { font-variant-numeric: tabular-nums; }

.board {
  min-height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  gap: 18px;
}

/* Header */
.top {
  grid-column: 1 / -1;
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.clock { font-family: var(--display); font-weight: 600; font-size: 68px; line-height: 0.95; letter-spacing: -0.5px; }
.date { font-family: var(--display); font-weight: 500; font-size: 34px; color: var(--muted); }

/* Weather panel */
.weather {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0;
}
.now { display: flex; align-items: center; gap: 6px 24px; flex-wrap: wrap; }
.temp { font-family: var(--display); font-weight: 600; font-size: 112px; line-height: 0.85; }
.temp small { font-size: 0.4em; vertical-align: top; font-weight: 500; color: var(--muted); }
.cond { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cond .what { font-family: var(--display); font-weight: 600; font-size: 42px; line-height: 1; }
.cond .sub { color: var(--muted); font-size: 21px; }
.facts { display: flex; gap: 22px; flex-wrap: wrap; color: var(--muted); font-size: 19px; }
.facts b { color: var(--ink); font-weight: 600; }

.rain-line {
  border-left: 5px solid var(--rain); padding: 4px 0 4px 14px;
  font-size: 24px; font-weight: 500;
}
.rain-line.dry { border-left-color: var(--good); }

.bike {
  background: var(--bg); border-radius: 10px; padding: 10px 16px; display: grid; gap: 2px;
}
.bike .label { font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.bike .call { font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1.05; }
.bike .call.ok { color: var(--good); }
.bike .call.caution { color: var(--warn); }
.bike .wear { font-size: 20px; color: var(--ink); }

.hours { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; margin-top: auto; }
.hour { border-top: 3px solid var(--line); padding-top: 8px; display: grid; gap: 2px; text-align: center; }
.hour .h { color: var(--muted); font-size: 17px; font-weight: 500; }
.hour .t { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1; }
.hour .p { font-size: 17px; color: var(--rain); font-weight: 600; min-height: 1.2em; }
.hour.wet { border-top-color: var(--rain); }

.sun { display: flex; gap: 22px; color: var(--muted); font-size: 18px; flex-wrap: wrap; }
.sun b { color: var(--ink); font-weight: 600; }
.status { color: var(--muted); font-size: 15px; }
.status.err { color: var(--warn); }

/* Train board: a departure board look, constant dark in both themes */
.trains {
  background: var(--board); color: var(--board-ink); border-radius: 14px; padding: 22px 26px;
  display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0;
}
.trains h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1.05; color: #f4f7f9; }
.trains .route { color: var(--board-dim); font-size: 18px; margin-top: 2px; }
.dep { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: baseline; border-top: 1px solid var(--board-line); padding-top: 12px; }
.dep .at { font-family: var(--display); font-weight: 600; font-size: 52px; line-height: 1; }
.dep .in { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; text-align: right; }
.dep .meta { grid-column: 1 / -1; color: var(--board-dim); font-size: 17px; }
.dep.first .at { font-size: 76px; }
.dep.first .in { font-size: 56px; }
.dep.soon .in { color: #ff8a65; }
.empty { color: var(--board-dim); font-size: 20px; line-height: 1.4; border-top: 1px solid var(--board-line); padding-top: 14px; }
.trains .foot { margin-top: auto; color: var(--board-dim); font-size: 15px; }

.trains iframe { flex: 1; min-height: 260px; width: 100%; border: 0; border-radius: 8px; background: #eeeeee; }
.trains .foot a { color: var(--board-ink); }
.live-btn {
  display: block; text-align: center; text-decoration: none;
  background: var(--board-ink); color: #15232d; border-radius: 12px;
  font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1.1; padding: 18px 16px;
}
.live-btn:focus-visible { outline: 3px solid #f4f7f9; outline-offset: 3px; }

.precip { display: grid; gap: 4px; }
.rain-detail { border-left: 5px solid transparent; padding-left: 14px; color: var(--muted); font-size: 19px; min-height: 1.2em; }
.sky { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; }
.moon { display: flex; align-items: center; gap: 12px; }
.moon svg { flex: none; }
.moon-dark { fill: var(--board); stroke: var(--line); stroke-width: 1; }
.moon-lit { fill: #f3e7b8; }
.moon-text { display: grid; gap: 0; font-size: 17px; color: var(--muted); }
.moon-text b { color: var(--ink); font-size: 20px; font-weight: 600; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .board { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .clock { font-size: 60px; }
  .temp { font-size: 110px; }
  .hours { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="board">
  <header class="top">
    <div class="clock num" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </header>

  <section class="weather" aria-label="Weather">
    <div class="now">
      <div class="temp num" id="temp">--<small>°F</small></div>
      <div class="cond">
        <div class="what" id="what">Loading weather</div>
        <div class="sub num" id="feels"></div>
        <div class="facts num" id="facts"></div>
      </div>
    </div>

    <div class="precip">
      <div class="rain-line dry" id="rain">Checking the next 24 hours</div>
      <div class="rain-detail num" id="rainDetail"></div>
    </div>

    <div class="bike" aria-label="Bike commute">
      <div class="label">Bike to campus</div>
      <div class="call" id="bikeCall">--</div>
      <div class="wear" id="bikeWear"></div>
    </div>

    <div class="hours" id="hours" aria-label="Next hours"></div>

    <div class="sky">
      <div class="moon" id="moon"></div>
      <div class="sun num" id="sun"></div>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="trains" aria-label="Metra Electric">
    <div>
      <h2>Metra Electric, northbound</h2>
      <div class="route">59th Street to 51st-53rd Street (Hyde Park)</div>
    </div>
    <iframe id="tracker" title="Live Metra Electric arrivals at 59th Street" referrerpolicy="no-referrer" hidden></iframe>
    <a id="liveLink" class="live-btn" target="_blank" rel="noopener">Live trains from 59th Street</a>
    <div id="deps"></div>
    <div class="foot" id="trainFoot"></div>
  </section>
</main>

<script>
/* ---------------------------------------------------------------
   SETTINGS
   --------------------------------------------------------------- */
// Hyde Park, Chicago. The forecast is for this point.
const LAT = 41.79, LON = -87.59;
const REFRESH_MINUTES = 15;

// Metra Electric schedule, northbound (inbound toward Millennium Station).
// Times are "HH:MM" in 24-hour form. "arr" (arrival at 51st-53rd) is optional.
// Fill these in from the current timetable on metra.com. Example row:
//   { dep: "07:12", arr: "07:15" }
// Left empty on purpose, so the board never shows a made-up train.
const TRAINS = {
  weekday: [],
  saturday: [],
  sunday: []
};
// Holidays are not handled. Check metra.com on those days.

// Live predictions from Metra Tracker: 59th Street, Metra Electric inbound.
// With EMBED_TRACKER on, the right-hand panel shows that page instead of the
// schedule list above. If the panel stays blank, the site refuses to be embedded:
// set EMBED_TRACKER to false to use the schedule list, or open the link in the panel footer.
const TRACKER_URL = "https://metratracker.com/predictions/bustime:ME/INBOUND/59TH-UP/51ST-53RD";
const EMBED_TRACKER = false; // metratracker.com refuses to be embedded, so this stays false.

/* ---------------------------------------------------------------
   HELPERS
   --------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const fmtTime = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const fmtHour = (d) => d.toLocaleTimeString([], { hour: "numeric" });
const round = (x) => Math.round(x);

const WEATHER = {
  0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Freezing fog",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
  80: "Rain showers", 81: "Rain showers", 82: "Heavy showers",
  85: "Snow showers", 86: "Heavy snow showers",
  95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail"
};
const isSnow = (c) => [71, 73, 75, 77, 85, 86].includes(c);
const isIcy = (c) => [56, 57, 66, 67].includes(c);

/* ---------------------------------------------------------------
   CLOCK
   --------------------------------------------------------------- */
function tickClock() {
  const now = new Date();
  $("clock").textContent = fmtTime(now);
  $("date").textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  renderTrains(now);
}

/* ---------------------------------------------------------------
   TRAINS
   --------------------------------------------------------------- */
function dayType(d) {
  const w = d.getDay();
  return w === 0 ? "sunday" : w === 6 ? "saturday" : "weekday";
}
function atToday(hhmm, base) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(base);
  d.setHours(h, m, 0, 0);
  return d;
}
function setupTracker() {
  const frame = $("tracker");
  const foot = $("trainFoot");
  frame.src = TRACKER_URL;
  frame.hidden = false;
  $("deps").hidden = true;
  foot.textContent = "";
  const a = document.createElement("a");
  a.href = TRACKER_URL;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "Open the live tracker in its own tab";
  foot.appendChild(a);
}
function renderTrains(now) {
  if (EMBED_TRACKER) return;
  const box = $("deps");
  const type = dayType(now);
  const list = TRAINS[type] || [];
  const foot = $("trainFoot");
  box.textContent = "";

  if (!list.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Tap the button above for live arrivals. A schedule list can be added to the TRAINS list at the top of the script.";
    box.appendChild(e);
    foot.textContent = "";
    return;
  }

  const upcoming = list
    .map((t) => ({ dep: atToday(t.dep, now), arr: t.arr ? atToday(t.arr, now) : null }))
    .filter((t) => t.dep > now)
    .sort((a, b) => a.dep - b.dep)
    .slice(0, 4);

  if (!upcoming.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No more northbound trains today.";
    box.appendChild(e);
    foot.textContent = "Schedule times, not live. Check metra.com for delays.";
    return;
  }

  upcoming.forEach((t, i) => {
    const mins = Math.max(0, Math.ceil((t.dep - now) / 60000));
    const row = document.createElement("div");
    row.className = "dep" + (i === 0 ? " first" : "") + (mins <= 8 ? " soon" : "");
    const at = document.createElement("div");
    at.className = "at num";
    at.textContent = fmtTime(t.dep);
    const inn = document.createElement("div");
    inn.className = "in num";
    inn.textContent = mins < 60 ? mins + " min" : Math.floor(mins / 60) + " h " + (mins % 60) + " min";
    row.append(at, inn);
    if (t.arr) {
      const meta = document.createElement("div");
      meta.className = "meta num";
      meta.textContent = "Arrives 51st-53rd " + fmtTime(t.arr);
      row.appendChild(meta);
    }
    box.appendChild(row);
  });
  foot.textContent = "Schedule times, not live. Check metra.com for delays.";
}

/* ---------------------------------------------------------------
   WEATHER
   --------------------------------------------------------------- */
/* Rain and snow detail. Amounts are inches. */
function renderPrecip(d, i0, idx) {
  const H = d.hourly;
  const next = idx(24);
  const amt = (i) => H.precipitation[i] || 0;
  const wet = (i) => amt(i) >= 0.01;
  const rain = $("rain");
  const det = $("rainDetail");
  const first = next.find(wet);

  if (first === undefined) {
    const maxP = Math.max(...next.map((i) => H.precipitation_probability[i] || 0));
    const at = next.find((i) => (H.precipitation_probability[i] || 0) === maxP);
    rain.textContent = "No rain or snow expected in the next 24 hours";
    rain.className = "rain-line dry";
    det.textContent = maxP >= 20 ? "Highest chance " + maxP + "% around " + fmtHour(new Date(H.time[at])) : "";
    return;
  }

  // End of the first wet spell. A single dry hour inside it does not end it.
  const startK = next.indexOf(first);
  let endK = startK;
  for (let k = startK; k < next.length; k++) {
    if (wet(next[k])) endK = k;
    else if (k + 1 < next.length && wet(next[k + 1])) continue;
    else break;
  }
  const block = next.slice(startK, endK + 1);
  const snow = block.reduce((s, i) => s + (H.snowfall[i] || 0), 0);
  const liquid = block.reduce((s, i) => s + (H.rain[i] || 0) + (H.showers[i] || 0), 0);
  const icy = block.some((i) => isIcy(H.weather_code[i]));
  let kind;
  if (icy) kind = "Freezing rain";
  else if (snow >= 0.1 && liquid >= 0.05) kind = "Rain and snow";
  else if (snow >= 0.04) kind = "Snow";
  else if (liquid > 0) kind = "Rain";
  else kind = H.temperature_2m[first] <= 32 ? "Snow" : "Rain";

  const nowWet = first === i0;
  const lastHour = new Date(H.time[next[endK]]);
  const endsAt = new Date(lastHour.getTime() + 3600000);
  const runsOn = endK === next.length - 1;
  let head = nowWet ? kind + " now" : kind + " starts around " + fmtHour(new Date(H.time[first]));
  head += runsOn ? ", continuing into tomorrow" : ", ending around " + fmtHour(endsAt);
  rain.textContent = head;
  rain.className = "rain-line";

  const parts = [];
  const maxP = Math.max(...block.map((i) => H.precipitation_probability[i] || 0));
  parts.push("Chance up to " + maxP + "%");
  if (block.length >= 3) {
    const peak = block.reduce((b, i) => (amt(i) > amt(b) ? i : b), block[0]);
    parts.push("Heaviest around " + fmtHour(new Date(H.time[peak])));
  }
  const amounts = [];
  if (snow >= 0.1) amounts.push("about " + snow.toFixed(1) + " in of snow");
  if (liquid >= 0.02) amounts.push("about " + liquid.toFixed(2) + " in of rain");
  if (amounts.length) parts.push(amounts.join(" and "));
  else parts.push("only a trace");
  const later = next.find((i, k) => k > endK + 1 && wet(i));
  if (later !== undefined) parts.push("more around " + fmtHour(new Date(H.time[later])));
  det.textContent = parts.join("  ·  ");
}

/* Moon phase, computed on the device from the mean lunar cycle. Good to within about a day. */
const SYNODIC = 29.530588853;
const NEW_MOON_REF = Date.UTC(2000, 0, 6, 18, 14);
function moonState(date) {
  const days = (date.getTime() - NEW_MOON_REF) / 86400000;
  const f = (((days % SYNODIC) + SYNODIC) % SYNODIC) / SYNODIC; // 0 new, 0.5 full
  return { f, lit: (1 - Math.cos(2 * Math.PI * f)) / 2 };
}
function moonName(f) {
  if (f < 0.03 || f > 0.97) return "New moon";
  if (f < 0.22) return "Waxing crescent";
  if (f < 0.28) return "First quarter";
  if (f < 0.47) return "Waxing gibbous";
  if (f < 0.53) return "Full moon";
  if (f < 0.72) return "Waning gibbous";
  if (f < 0.78) return "Last quarter";
  return "Waning crescent";
}
function nextPhase(date, target) {
  const { f } = moonState(date);
  let delta = (target - f + 1) % 1;
  if (delta < 0.002) delta += 1;
  return new Date(date.getTime() + delta * SYNODIC * 86400000);
}
function moonSvg(f) {
  const NS = "http://www.w3.org/2000/svg";
  const r = 20, c = 22;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 44 44");
  svg.setAttribute("width", "44");
  svg.setAttribute("height", "44");
  svg.setAttribute("aria-hidden", "true");
  const dark = document.createElementNS(NS, "circle");
  dark.setAttribute("cx", c); dark.setAttribute("cy", c); dark.setAttribute("r", r);
  dark.setAttribute("class", "moon-dark");
  const fw = f < 0.5 ? f : 1 - f;
  const cosv = Math.cos(2 * Math.PI * fw);
  const rx = r * Math.abs(cosv);
  const sweep = cosv > 0 ? 0 : 1;
  const lit = document.createElementNS(NS, "path");
  lit.setAttribute("d", "M " + c + " " + (c - r) + " A " + r + " " + r + " 0 0 1 " + c + " " + (c + r) +
    " A " + rx + " " + r + " 0 0 " + sweep + " " + c + " " + (c - r) + " Z");
  lit.setAttribute("class", "moon-lit");
  if (f >= 0.5) lit.setAttribute("transform", "translate(" + (2 * c) + " 0) scale(-1 1)");
  svg.append(dark, lit);
  return svg;
}
function renderMoon() {
  const now = new Date();
  const { f, lit } = moonState(now);
  const box = $("moon");
  box.textContent = "";
  const txt = document.createElement("div");
  txt.className = "moon-text num";
  const name = document.createElement("b");
  name.textContent = moonName(f);
  const line = document.createElement("span");
  const fullDate = nextPhase(now, 0.5).toLocaleDateString([], { month: "short", day: "numeric" });
  line.textContent = round(lit * 100) + "% lit  ·  next full moon about " + fullDate;
  txt.append(name, line);
  box.append(moonSvg(f), txt);
}

let lastGood = null;

async function loadWeather() {
  const url = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m,relative_humidity_2m" +
    "&hourly=temperature_2m,precipitation_probability,precipitation,rain,showers,snowfall,weather_code,apparent_temperature,wind_gusts_10m" +
    "&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,daylight_duration" +
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch" +
    "&timezone=America%2FChicago&forecast_days=2";
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    lastGood = { data, at: new Date() };
    renderWeather(data);
    setStatus("Updated " + fmtTime(lastGood.at) + ". Forecast from Open-Meteo.", false);
  } catch (err) {
    if (lastGood) {
      setStatus("Weather is offline. Showing data from " + fmtTime(lastGood.at) + ".", true);
    } else {
      $("what").textContent = "Weather unavailable";
      setStatus("Could not reach the forecast service. Check the Wi-Fi connection. Retrying soon.", true);
    }
  }
}
function setStatus(text, isErr) {
  const s = $("status");
  s.textContent = text;
  s.className = "status" + (isErr ? " err" : "");
}

function renderWeather(d) {
  const cur = d.current;
  const code = cur.weather_code;
  $("temp").innerHTML = round(cur.temperature_2m) + "<small>°F</small>";
  $("what").textContent = WEATHER[code] || "Weather";
  $("feels").textContent = "Feels like " + round(cur.apparent_temperature) + "°  ·  High " +
    round(d.daily.temperature_2m_max[0]) + "°  ·  Low " + round(d.daily.temperature_2m_min[0]) + "°";
  const gust = round(cur.wind_gusts_10m);
  $("facts").innerHTML = "";
  const f1 = document.createElement("span");
  f1.append("Wind ");
  const b1 = document.createElement("b"); b1.textContent = round(cur.wind_speed_10m) + " mph"; f1.appendChild(b1);
  f1.append(" (gusts " + gust + ")");
  const f2 = document.createElement("span");
  f2.append("Humidity ");
  const b2 = document.createElement("b"); b2.textContent = round(cur.relative_humidity_2m) + "%"; f2.appendChild(b2);
  $("facts").append(f1, f2);

  // Find the current hour in the hourly arrays (API times are local, like "2026-11-07T14:00").
  const hourKey = cur.time.slice(0, 13);
  let i0 = d.hourly.time.findIndex((t) => t.slice(0, 13) === hourKey);
  if (i0 < 0) i0 = 0;
  const idx = (n) => Array.from({ length: n }, (_, k) => i0 + k).filter((i) => i < d.hourly.time.length);

  // Hourly strip: the next 8 hours.
  const strip = $("hours");
  strip.textContent = "";
  idx(8).forEach((i, k) => {
    const when = new Date(d.hourly.time[i]);
    const p = d.hourly.precipitation_probability[i];
    const el = document.createElement("div");
    el.className = "hour" + (p >= 40 ? " wet" : "");
    const h = document.createElement("div"); h.className = "h"; h.textContent = k === 0 ? "Now" : fmtHour(when);
    const t = document.createElement("div"); t.className = "t num"; t.textContent = round(d.hourly.temperature_2m[i]) + "°";
    const pr = document.createElement("div"); pr.className = "p num"; pr.textContent = p >= 10 ? p + "%" : "";
    el.append(h, t, pr);
    strip.appendChild(el);
  });

  // Rain and snow: timing, chance and amounts over the next 24 hours.
  renderPrecip(d, i0, idx);

  // Bike call, from the next 3 hours.
  const n3 = idx(3);
  const maxP = Math.max(...n3.map((i) => d.hourly.precipitation_probability[i]));
  const maxGust = Math.max(...n3.map((i) => d.hourly.wind_gusts_10m[i]));
  const feel = cur.apparent_temperature;
  const icy = n3.some((i) => isIcy(d.hourly.weather_code[i]) || (d.hourly.temperature_2m[i] <= 32 && d.hourly.precipitation_probability[i] >= 40));
  const call = $("bikeCall");
  if (icy || feel <= 5 || maxGust >= 35) {
    call.textContent = icy ? "Icy. Walk or take the train." : "Rough out there. Consider walking.";
    call.className = "call caution";
  } else if (maxP >= 50) {
    call.textContent = "Bike with rain gear";
    call.className = "call caution";
  } else if (feel <= 25 || maxGust >= 25) {
    call.textContent = "Bike, bundled up";
    call.className = "call caution";
  } else {
    call.textContent = "Good for the bike";
    call.className = "call ok";
  }
  let wear;
  if (feel >= 70) wear = "Short sleeves are fine.";
  else if (feel >= 55) wear = "Light jacket.";
  else if (feel >= 40) wear = "Jacket and light gloves.";
  else if (feel >= 28) wear = "Winter jacket, warm gloves, ear cover.";
  else if (feel >= 15) wear = "Insulated layers, face cover, winter gloves.";
  else wear = "Full winter kit. Cover all skin.";
  $("bikeWear").textContent = "Feels like " + round(feel) + "°. " + wear;

  // Sunrise and sunset.
  const sun = $("sun");
  sun.textContent = "";
  const mk = (label, iso) => {
    const s = document.createElement("span");
    s.append(label + " ");
    const b = document.createElement("b");
    b.textContent = fmtTime(new Date(iso));
    s.appendChild(b);
    return s;
  };
  const dl = d.daily.daylight_duration;
  const hm = (s) => { const m = Math.round(s / 60); return Math.floor(m / 60) + " h " + (m % 60) + " m"; };
  const dayLen = document.createElement("span");
  dayLen.append("Daylight ");
  const bd = document.createElement("b");
  bd.textContent = hm(dl[0]);
  dayLen.appendChild(bd);
  if (dl.length > 1) {
    const diff = dl[1] - dl[0];
    const ar = Math.round(Math.abs(diff));
    dayLen.append("  (" + Math.floor(ar / 60) + " m " + (ar % 60) + " s " + (diff >= 0 ? "longer" : "shorter") + " tomorrow)");
  }
  sun.append(mk("Sunrise", d.daily.sunrise[0]), mk("Sunset", d.daily.sunset[0]), dayLen);
}

/* ---------------------------------------------------------------
   START
   --------------------------------------------------------------- */
$("liveLink").href = TRACKER_URL;
renderMoon();
setInterval(renderMoon, 30 * 60 * 1000);
if (EMBED_TRACKER) setupTracker();
tickClock();
setInterval(tickClock, 1000);
loadWeather();
setInterval(loadWeather, REFRESH_MINUTES * 60 * 1000);

// Ask the screen to stay on while the page is visible. Safe to ignore if refused.
async function keepAwake() {
  try {
    if ("wakeLock" in navigator) await navigator.wakeLock.request("screen");
  } catch (e) { /* not available */ }
}
keepAwake();
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
</script>
